name: Production-Release-Automation
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy_release:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Create Standard Project Structure
        run: |
          mkdir -p EasyPhotoAssetChange/Base.lproj
          if [ -f "ContentView.swift" ]; then
            mv ContentView.swift EasyPhotoAssetChange/
          fi
          
          cat <<EOF > EasyPhotoAssetChange/AppEntry.swift
          import SwiftUI
          @main
          struct GeoModifierApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          EOF

          cat <<EOF > EasyPhotoAssetChange/EasyPhotoAssetChange.entitlements
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.developer.applesignin</key>
              <array>
                  <string>Default</string>
              </array>
              <key>com.apple.security.personal-information.photos-library</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Generate Xcode Project (Dynamic)
        run: |
          cat <<EOF > Package.swift
          // swift-tools-version: 5.9
          import PackageDescription
          let package = Package(
              name: "EasyPhotoAssetChange",
              platforms: [.iOS(.v17)],
              products: [.executable(name: "EasyPhotoAssetChange", targets: ["EasyPhotoAssetChange"])],
              targets: [.executableTarget(name: "EasyPhotoAssetChange", path: "EasyPhotoAssetChange")]
          )
          EOF
          swift package generate-xcodeproj

      - name: Standard Build and Archive
        run: |
          xcodebuild -project EasyPhotoAssetChange.xcodeproj \
            -scheme EasyPhotoAssetChange \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/EasyPhotoAssetChange.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean archive

      - name: Construct IPA for Sideloading
        run: |
          mkdir -p Payload
          cp -r build/EasyPhotoAssetChange.xcarchive/Products/usr/local/bin/EasyPhotoAssetChange.app Payload/ || \
          cp -r build/EasyPhotoAssetChange.xcarchive/Products/Applications/EasyPhotoAssetChange.app Payload/
          INFO_PLIST="Payload/EasyPhotoAssetChange.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string com.ra1nyxin.EasyPhotoAssetChange" $INFO_PLIST || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleSupportedPlatforms array" $INFO_PLIST || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleSupportedPlatforms:0 string iPhoneOS" $INFO_PLIST || true
          /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 15.0" $INFO_PLIST || true
          
          zip -r EasyPhotoAssetChange.ipa Payload

      - name: Create Randomized Metadata
        id: meta
        run: |
          RAND_VAL=$(openssl rand -hex 4)
          RAND_UPPER=$(echo "$RAND_VAL" | tr '[:lower:]' '[:upper:]')
          echo "TAG_NAME=v1.0.${RAND_VAL}" >> $GITHUB_ENV
          echo "RELEASE_TITLE=Release-Build-${RAND_UPPER}" >> $GITHUB_ENV

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_TITLE }}
          files: EasyPhotoAssetChange.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
