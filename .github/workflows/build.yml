name: Production-Release-Automation
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy_release:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Synthesize Production Code
        run: |
          mkdir -p build/Payload/EasyPhotoAssetChange.app
          
          cat <<EOF > UnifiedSource.swift
          import SwiftUI
          import Photos
          import PhotosUI
          import MapKit

          $(cat ContentView.swift)

          @main
          struct GeoModifierApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          EOF

          cat <<EOF > Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>EasyPhotoAssetChange</string>
              <key>CFBundleIdentifier</key>
              <string>com.ra1nyxin.EasyPhotoAssetChange</string>
              <key>CFBundleName</key>
              <string>GeoModifier</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>NSPhotoLibraryUsageDescription</key>
              <string>需要访问相册以修改图片位置信息</string>
              <key>NSPhotoLibraryAddUsageDescription</key>
              <string>需要保存修改后的地理位置数据</string>
              <key>NSLocationWhenInUseUsageDescription</key>
              <string>用于地图选点参考</string>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
              <key>CFBundleSupportedPlatforms</key>
              <array><string>iPhoneOS</string></array>
              <key>UIDeviceFamily</key>
              <array><integer>1</integer><integer>2</integer></array>
              <key>UILaunchScreen</key>
              <dict/>
          </dict>
          </plist>
          EOF

      - name: Bare-Metal Toolchain Compilation
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          xcrun swiftc UnifiedSource.swift \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios17.0 \
            -O -whole-module-optimization \
            -parse-as-library \
            -o build/Payload/EasyPhotoAssetChange.app/EasyPhotoAssetChange \
            -framework SwiftUI \
            -framework Photos \
            -framework PhotosUI \
            -framework MapKit \
            -framework UIKit \
            -Xlinker -rpath -Xlinker /usr/lib/swift \
            -Xlinker -rpath -Xlinker @executable_path/Frameworks

      - name: Bundle Finalization & Validation
        run: |
          cp Info.plist build/Payload/EasyPhotoAssetChange.app/
          echo "APPL????" > build/Payload/EasyPhotoAssetChange.app/PkgInfo
          
          mkdir -p build/Payload/EasyPhotoAssetChange.app/_CodeSignature
          
          if [ ! -f "build/Payload/EasyPhotoAssetChange.app/EasyPhotoAssetChange" ]; then
            echo "[CRITICAL] Binary missing post-compilation."
            exit 1
          fi
          
          lipo -info build/Payload/EasyPhotoAssetChange.app/EasyPhotoAssetChange
          
          cd build
          zip -r ../EasyPhotoAssetChange.ipa Payload

      - name: Release Logic
        id: meta
        run: |
          RAND_VAL=$(openssl rand -hex 4)
          RAND_UPPER=$(echo "$RAND_VAL" | tr '[:lower:]' '[:upper:]')
          echo "TAG_NAME=v1.0.${RAND_VAL}" >> $GITHUB_ENV
          echo "RELEASE_TITLE=Release-Build-${RAND_UPPER}" >> $GITHUB_ENV

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_TITLE }}
          files: EasyPhotoAssetChange.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
