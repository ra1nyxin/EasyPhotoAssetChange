name: CI-CD-iOS-Dist
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_and_archive:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode Environment
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Generate Minimal Xcode Project
        run: |
          mkdir -p EasyPhotoAssetChange/Base.lproj
          
          if [ -f "ContentView.swift" ]; then
            mv ContentView.swift EasyPhotoAssetChange/
          fi

          cat <<EOF > EasyPhotoAssetChange/AppEntry.swift
          import SwiftUI
          @main
          struct GeoModifierApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          EOF

          cat <<EOF > EasyPhotoAssetChange/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>\$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>com.ra1nyxin.EasyPhotoAssetChange</string>
              <key>CFBundleName</key>
              <string>GeoModifier</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>NSPhotoLibraryUsageDescription</key>
              <string>需要访问相册以修改图片位置信息</string>
              <key>NSPhotoLibraryAddUsageDescription</key>
              <string>需要保存修改后的地理位置数据</string>
              <key>NSLocationWhenInUseUsageDescription</key>
              <string>用于地图选点参考</string>
          </dict>
          </plist>
          EOF

      - name: Compile Single File App
        run: |
          mkdir -p build/Payload
          
          xcrun -sdk iphoneos swiftc \
            -target arm64-apple-ios17.0 \
            -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
            -O -whole-module-optimization \
            -o build/Payload/EasyPhotoAssetChange \
            EasyPhotoAssetChange/ContentView.swift \
            EasyPhotoAssetChange/AppEntry.swift
            
          mkdir -p build/Payload/EasyPhotoAssetChange.app
          mv build/Payload/EasyPhotoAssetChange build/Payload/EasyPhotoAssetChange.app/
          cp EasyPhotoAssetChange/Info.plist build/Payload/EasyPhotoAssetChange.app/
          echo "APPL????" > build/Payload/EasyPhotoAssetChange.app/PkgInfo

      - name: Package IPA
        run: |
          cd build
          zip -r ../EasyPhotoAssetChange.ipa Payload

      - name: Archive Production IPA
        uses: actions/upload-artifact@v4
        with:
          name: GeoModifier-Production
          path: EasyPhotoAssetChange.ipa
          retention-days: 7
