name: Production-Release-Automation
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy_release:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Initialize App Structure
        run: |
          mkdir -p EasyPhotoAssetChange/Base.lproj

          if [ -f "ContentView.swift" ]; then
            mv ContentView.swift EasyPhotoAssetChange/
          fi
          
          cat <<EOF > EasyPhotoAssetChange/AppEntry.swift
          import SwiftUI
          @main
          struct GeoModifierApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          EOF

          cat <<EOF > EasyPhotoAssetChange/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>EasyPhotoAssetChange</string>
              <key>CFBundleIdentifier</key>
              <string>com.ra1nyxin.EasyPhotoAssetChange</string>
              <key>CFBundleName</key>
              <string>GeoModifier</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>NSPhotoLibraryUsageDescription</key>
              <string>需要访问相册以修改图片位置信息</string>
              <key>NSPhotoLibraryAddUsageDescription</key>
              <string>需要保存修改后的地理位置数据</string>
              <key>NSLocationWhenInUseUsageDescription</key>
              <string>用于地图选点参考</string>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
          </dict>
          </plist>
          EOF

      - name: Hardened Compilation (arm64)
        run: |
          mkdir -p build/Payload/EasyPhotoAssetChange.app
          xcrun -sdk iphoneos swiftc \
            -target arm64-apple-ios17.0 \
            -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
            -O -whole-module-optimization \
            -o build/Payload/EasyPhotoAssetChange.app/EasyPhotoAssetChange \
            EasyPhotoAssetChange/ContentView.swift \
            EasyPhotoAssetChange/AppEntry.swift
            
          cp EasyPhotoAssetChange/Info.plist build/Payload/EasyPhotoAssetChange.app/
          echo "APPL????" > build/Payload/EasyPhotoAssetChange.app/PkgInfo

      - name: Generate IPA Packet
        run: |
          cd build
          zip -r ../EasyPhotoAssetChange.ipa Payload
          cd ..

      - name: Create Randomized Metadata
        id: meta
        run: |
          RAND_VAL=$(openssl rand -hex 4)
          RAND_UPPER=$(echo "$RAND_VAL" | tr '[:lower:]' '[:upper:]')
          
          TAG_NAME="v1.0.${RAND_VAL}"
          RELEASE_TITLE="Release-Build-${RAND_UPPER}"
          
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "RELEASE_TITLE=$RELEASE_TITLE" >> $GITHUB_ENV

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_TITLE }}
          files: EasyPhotoAssetChange.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
